<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" </meta>

</head>

<body>
    <div id=main>
        <p>Hello world</p>
    </div>
    <header>
        <a href="index.html">
            <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fstatic.vecteezy.com%2Fsystem%2Fresources%2Fpreviews%2F023%2F652%2F073%2Foriginal%2Ffake-red-stamp-on-a-transparent-background-free-png.png&f=1&nofb=1&ipt=872c63cfb0080857cd3972b3f237fe59b8bff476debebc165bc24730cddb3317"
                alt="Company Logo" width="32" height="32">
            <span>Company</span>
        </a>
        <nav aria-label="mainmenu">
            <ul>
                <li><a href="index.html">Hem</a></li>
                <li><a href="#projects">Projekt</a></li>
                <li><a href="#about">Om</a></li>
                <li><a href="#contact">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Company Name</h1>
            <p>Some text.</p>
            <a href="#projects">View projects</a>
        </section>
        <section id="projects" aria-labelledby="projects-title">
            <h2 id="projects-title">Highlighted projects</h2>
            <div id="project-grid"></div>
        </section>
        <section id="about">
            <h2>About</h2>
            <p>Short text here - text text</p>
        </section>
        <section id="contact">
            <h2>Contact</h2>
            <form id="contact-form" novalidate>
                <label for="name">Name</label>
                <input id="name" name="name" type="text" required minlength="3">

                <label for="email">E-post</label>
                <input id="email" name="email" type="email" required>

                <label for="interest">Interests</label>
                <select id="interest" name="interest" required>
                    <option value="">Choose...</option>
                    <option value="web">Web</option>
                    <option value="design">Design</option>
                    <option value="app">App</option>
                </select>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4"></textarea>
                <button type="submit">Send</button>
                <p id="form-msg" role="status"></p>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2026 Company</p>
    </footer>
</body>

</html>
